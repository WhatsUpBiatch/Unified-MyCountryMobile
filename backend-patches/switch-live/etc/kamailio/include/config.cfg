server_header="SERVER_HEADER"
user_agent_header="USER_AGENT_HEADER"
memdbg=5
memlog=5
log_facility=LOG_LOCAL0
fork=yes
children=WORKERS
mhomed=0

socket_workers=WORKERS
listen=EXTERNAL_UDP_LISTEN_SOCKET

socket_workers=TCP_WORKERS
listen=EXTERNAL_TCP_LISTEN_SOCKET
listen=EXTERNAL_TLS_LISTEN_SOCKET

socket_workers=WORKERS
listen=EXTERNAL_HTTP_SOCKET

socket_workers=WORKERS
listen=INTERNAL_UDP_SOCKET

socket_workers=1
listen=TCP_HEALTHCHECK

socket_workers=1
listen=METRICS_SOCKET

tcp_max_connections=TCP_CONNECTION_LIMIT
tcp_accept_no_cl=yes # Needed for HTTP (https://www.kamailio.org/wiki/cookbooks/devel/core#tcp_accept_no_cl)
tcp_no_connect=0
enable_tls=yes
auto_aliases=no
