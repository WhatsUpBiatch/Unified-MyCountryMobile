####### Routing Logic ########

# Main SIP request routing logic
# - processing of any incoming SIP request starts with this route
request_route {

    # per request initial checks
    route(REQINIT);

    # check source ip address
    route(CHECK_SOURCE_TYPE);

#!ifdef SIPTRACE_CAPTURE_ID
    sip_trace();
    sip_trace_mode("t");
#!endif

    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    # handle REGISTER
    if (is_method("REGISTER")) {
        route(REGISTER);
        exit;
    }

    # handle SUBSCRIBE
    if (is_method("SUBSCRIBE")) {
        route(SUBSCRIBE);
        exit;
    }

    # handle requests within SIP dialogs
    route(WITHINDLG);

    # initial requests
    if (is_method("INVITE|REFER")) {
        record_route();
    }
    route(INVITE);

    route(CHECKSYNC);
}

# Per SIP request initial checks
route[REQINIT] {
    if (!mf_process_maxfwd_header("10")) {
        xlog("L_WARN", "[$ci][$rm]: too many hops");
        send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check()) {
        xlog("L_WARN", "[$ci][$rm]: message is insane");
        exit;
    }
    if (pcre_match_group("$ua", "0")) {
        xlog("L_WARN", "[$ci][$rm]: dropping message [$rm] with user-agent [$ua]");
        exit;
    }
    if (is_method("PUBLISH")) {
        xlog("L_WARN", "[$ci][$rm]: dropping unsupported message [$rm] from user-agent [$ua]");
        exit;
    }
}

route[CHECK_SOURCE_TYPE] {
    if ($Rp == "INTERNAL_SIP_PORT") {
        if (is_present_hf("SIPXOUTBOUND")) {
            setflag(FLAG_OUTBOUND);
            remove_hf("SIPXOUTBOUND");
            return;
        }
        setflag(FLAG_TO_USER);
        return;
    } else if (allow_source_address("1")) {
        if ($si == "127.0.0.1" && is_present_hf("SIPXOUTBOUND")) {
            setflag(FLAG_OUTBOUND);
            remove_hf("SIPXOUTBOUND");
            xlog("L_INFO", "[$ci][$rm]: outbound call from FreeSWITCH [$ru]");
            return;
        }
        append_hf("SIPXFROMPROVIDER:1\r\n");
        setflag(FLAG_INBOUND);
        xlog("L_INFO", "[$ci][$rm]: from provider ip addr [$si] ($fu)");
        return;
    } else if (!allow_routing("user")) {
        xlog("L_WARN", "[$ci][$rm]: dropping unauthorized message $si ($fu)");
        exit;
    }
    append_hf("SIPXFROMUSER:1\r\n");
    append_hf("X-Domain: $fd\r\n");
    if ($Rp == "EXTERNAL_WSS_PORT") {
        append_hf("SIPXFROMWEBRTC:1\r\n");
    }
    route(NAT_TEST_AND_CORRECT);
}

route[INVITE] {
    if (!is_method("INVITE")) {
        return;
    }
    if (isflagset(FLAG_OUTBOUND)) {
        remove_hf("Route");
        xlog("L_INFO", "[$ci][$rm]: forwarding request outbound [$ru]");
        t_on_failure("OUTBOUND_FAILOVER");
        route(RELAY);
        return;
    }
    if (isflagset(FLAG_TO_USER)) {
        if (!handle_ruri_alias()) {
            xlog("L_ERR", "[$ci][$rm]: bad alias <$ru>");
            sl_send_reply("400", "Bad Request");
            exit;
        }
        xlog("L_INFO", "[$ci][$rm]: routing to user");
        route(RELAY);
        return;
    }
    if (isflagset(FLAG_INBOUND)) {
        $du = "sip:127.0.0.1:4066";
        xlog("L_INFO", "[$ci][$rm]: carrier inbound -> FS public profile [$ru]");
        route(RELAY);
        return;
    }
    $var(dispatch_setid) = $sht(dispatcher_sipcore_sets=>$fu);
    $avp(hash) = $fd;
    xlog("L_INFO", "[$ci][$rm]: dispatching [$rm] using hash [$avp(hash)] with setid [$var(dispatch_setid)]");
    if (!ds_select_dst("$var(dispatch_setid)", "7")) {
        xlog("L_WARN", "[$ci][$rm]: could not send [$rm] to dialog destination setid [$var(dispatch_setid)]");
        send_reply("404", "No destination");
        exit;
    }
    t_on_failure("DIALOG_FAILOVER");
    route(RELAY);
}

route[CHECKSYNC] {
    if (!is_method("NOTIFY") && $hdr(event) != "check-sync") {
        return;
    }
    if (!handle_ruri_alias()) {
        xlog("L_ERR", "[$ci][$rm]: bad alias <$ru>");
        sl_send_reply("400", "Bad Request");
        exit;
    }
    route(RELAY);
}

route[REGISTER] {
    if (nat_uac_test("19")) {
        force_rport();
        fix_nated_register();
    }
    if (!set_contact_alias()) {
        xlog("L_WARN", "[$ci][$rm]: could not add contact alias [$rm] - [$rs] [$Rp]");
    }
    add_path();
    $var(dispatch_setid) = $sht(dispatcher_sipcore_sets=>$fu);
    $avp(hash) = $fd;
    xlog("L_INFO", "[$ci][$rm]: dispatching [$rm] using hash [$avp(hash)] with setid [$var(dispatch_setid)]");
    if (!ds_select_dst("$var(dispatch_setid)", "7")) {
        xlog("L_WARN", "[$ci][$rm]: could not send [$rm] to destination setid [$var(dispatch_setid)]");
        send_reply("404", "No destination");
        exit;
    }
    t_on_failure("REGISTRAR_FAILOVER");
    route(RELAY);
}

route[SUBSCRIBE] {
    record_route();
    if (nat_uac_test("19")) {
        force_rport();
    }
    if (!set_contact_alias()) {
        xlog("L_WARN", "[$ci][$rm]: could not add contact alias [$rm] - [$rs] [$Rp]");
    }
    $var(dispatch_setid) = $sht(dispatcher_sipcore_sets=>$fu);
    $avp(hash) = $fd;
    xlog("L_INFO", "[$ci][$rm]: dispatching [$rm] using hash [$avp(hash)] with setid [$var(dispatch_setid)]");
    if (!ds_select_dst("$var(dispatch_setid)", "7")) {
        xlog("L_WARN", "[$ci][$rm]: could not send [$rm] to destination setid [$var(dispatch_setid)]");
        send_reply("404", "No destination");
        exit;
    }
    route(RELAY);
}

route[RELAY] {
    if (isflagset(FLAG_OUTBOUND)) {
        force_send_socket(EXTERNAL_UDP_SOCKET);
    } else if (!isflagset(FLAG_TO_USER)) {
        # Sequential in-dialog requests (ACK/BYE/re-INVITE) carry none of the
        # flags the initial INVITE set, so they used to be forced out of the
        # loopback socket even when the next hop is a carrier on the public
        # net. sendto() then fails with EINVAL, the carrier never sees the ACK,
        # retransmits its 200 OK and BYEs the call ~16s after answer. Pick the
        # socket from where the request is actually going instead.
        if ($dd == "127.0.0.1" || $dd == "localhost") {
            force_send_socket(INTERNAL_UDP_SOCKET);
        } else {
            xlog("L_INFO", "[$ci][$rm]: sequential request to [$dd] - using external socket");
            force_send_socket(EXTERNAL_UDP_SOCKET);
        }
    } else if ($oP == "TLS" || $oP == "tls") {
        xlog("L_INFO", "[$ci][$rm]: using tls socket [dP=$dP] [rP=$rP] [oP=$oP] [pr=$pr]");
        force_send_socket(EXTERNAL_TLS_SOCKET);
    } else if ($oP == "TCP" || $oP == "tcp") {
        xlog("L_INFO", "[$ci][$rm]: using tcp socket [dP=$dP] [rP=$rP] [oP=$oP] [pr=$pr]");
        force_send_socket(EXTERNAL_TCP_SOCKET);
    } else {
        xlog("L_INFO", "[$ci][$rm]: using udp socket [dP=$dP] [rP=$rP] [oP=$oP] [pr=$pr]");
        force_send_socket(EXTERNAL_UDP_SOCKET);
    }

    if (is_method("NOTIFY")) {
        $var(retcode) = t_relay();
        if ($var(retcode) < 0) {
            send_reply("408", "user cannot be reached");
        }
        exit;
    }

    if (!t_relay()) {
        if (isflagset(FLAG_TO_USER)) {
            send_reply("SIP_USER_UNREGISTER_CODE", "SIP_USER_UNREGISTER_PHRASE");
            exit;
        }
        xlog("L_WARN", "[$ci][$rm]: could not relay [$rm] Request-URI [$ru] From-URI [$fu] To-URI [$tu]");
        sl_reply_error();
    }
    exit;
}

reply_route {
    if ($Rp == "INTERNAL_SIP_PORT") {
        return;
    }
    route(NAT_TEST_AND_CORRECT);
    force_send_socket(INTERNAL_UDP_SOCKET);
}

failure_route[DIALOG_FAILOVER] {
    if (t_is_canceled()) {
        exit;
    }
    if (t_check_status("302")) {
        xlog("L_INFO", "[$ci][$rm]: call forward 302 - forwarding to caller. Contact: $ct");
        exit;
    }
    if (t_check_status("400|403|407|480|486|488")) {
        exit;
    }
    if (t_check_status("(408)|([56][0-9][0-9])")) {
        xlog("L_INFO", "[$ci][$rm]: failure detected during dispatch using hash [$avp(hash)]");
        if (ds_next_dst()) {
            xlog("L_INFO", "[$ci][$rm]: failover dispatched to server [$du] using hash [$avp(hash)]");
            t_on_failure("DIALOG_FAILOVER");
            route(RELAY);
            exit;
        }
    }
    send_reply("486", "Network Congestion");
}

failure_route[OUTBOUND_FAILOVER] {
    if (t_is_canceled()) {
        exit;
    }
    if (t_check_status("401|407")) {
        xlog("L_INFO", "[$ci][$rm]: outbound auth challenge received, authenticating");
        # Provider SIP trunk credentials (realm=mcm at 38.147.130.91)
        # TODO: Update these with actual credentials from provider
        $avp(auser) = "CHANGEME_USERNAME";
        $avp(apass) = "CHANGEME_PASSWORD";
        uac_auth();
        t_relay();
        exit;
    }
    if (t_check_status("(408)|([56][0-9][0-9])")) {
        xlog("L_WARN", "[$ci][$rm]: outbound call failed [$T_reply_code]");
    }
}

failure_route[REGISTRAR_FAILOVER] {
    if (t_check_status("(408)|([56][0-9][0-9])")) {
        xlog("L_INFO", "[$ci][$rm]: failure detected during dispatch using hash [$avp(hash)]");
        if (ds_next_dst()) {
            xlog("L_INFO", "[$ci][$rm]: failover dispatched to server [$du] using hash [$avp(hash)]");
            t_on_failure("REGISTRAR_FAILOVER");
            route(RELAY);
            exit;
        }
    }
}

route[NAT_TEST_AND_CORRECT] {
    force_rport();
    if (is_method("INVITE|PRACK|NOTIFY|REFER|UPDATE|BYE") && $ct != $null) {
        if (!set_contact_alias()) {
            xlog("L_WARN", "[$ci][$rm]: could not add contact alias [$rm] - [$rs] [$Rp]");
        }
    }
    if (has_body("application/sdp") && nat_uac_test("8")) {
        fix_nated_sdp("10");
    }
}

route[WITHINDLG] {
    if (!has_totag()) {
        return;
    }
    if (loose_route()) {
        if ($du == "") {
            if (!handle_ruri_alias()) {
                xlog("L_ERR", "[$ci][$rm]: bad alias <$ru>");
                sl_send_reply("400", "Bad Request");
                exit;
            }
        } else if (is_method("NOTIFY") && $Rp == "INTERNAL_SIP_PORT") {
            remove_hf("Route");
            if (!handle_ruri_alias()) {
                xlog("L_ERR", "[$ci][$rm]: bad alias <$ru>");
                sl_send_reply("400", "Bad Request");
                exit;
            }
        }
        route(RELAY);
    } else {
        if (is_method("NOTIFY")) {
            route(RELAY);
        }
        if (is_method("ACK")) {
            if (t_check_trans()) {
                t_relay();
                exit;
            } else {
                exit;
            }
        }
        sl_send_reply("404","Not here");
    }
    exit;
}

event_route[xhttp:request] {
    if ($Rp == "HTTP_PROM_PORT" && $hu == "/metrics") {
        prom_dispatch();
        return;
    }
    if ($Rp == "HEALTH_CHECK_PORT") {
        xlog("L_DEBUG", "[$ci][$rm]: HTTP request received on $Rp from $si (health check)");
        xhttp_reply("200", "OK", "application/json", "OK\n\r");
        return;
    }
    if ($Rp != "WS_PORT") {
        xlog("L_WARN", "invalid HTTP request received on $Rp from $si");
        xhttp_reply("403", "Forbidden", "", "");
        exit;
    }
    set_reply_close();
    set_reply_no_connect();
    if ($hdr(Upgrade)=~"websocket" && $hdr(Connection)=~"Upgrade" && $rm=~"GET") {
        if (!pcre_match_group("$hdr(Host)", "1")) {
            xlog("L_WARN", "[$rm]: bad host $hdr(Host)");
            xhttp_reply("403", "Forbidden", "", "");
            exit;
        }
        if (ws_handle_handshake()) {
            exit;
        }
    }
    xhttp_reply("404", "Not Found", "", "");
}

event_route[websocket:closed] {
    xlog("L_DEBUG", "[$ci][$rm]: websocket connection from $si:$sp has closed");
}
