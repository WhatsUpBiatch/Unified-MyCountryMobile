####### Modules Section ########
mpath="/usr/lib/x86_64-linux-gnu/kamailio/modules/"

loadmodule "db_sqlite.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "cfgutils.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
# outbound.so disabled: its Path flow token is standard base64, so roughly a
# quarter of the tokens contain a "/". FreeSWITCH's sofia-sip URL parser
# truncates the Route URI at that "/", losing the host, and the INVITE toward
# that registered contact is never put on the wire (nua_client.c:552 "Internal
# error") - the caller just gets NORMAL_UNSPECIFIED and the phone never rings.
# Contact aliasing (set_contact_alias / handle_ruri_alias) already carries the
# return path back to the WebSocket client, so the flow token was redundant.
# loadmodule "outbound.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "dialog.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "cfg_rpc.so"
loadmodule "auth.so"
loadmodule "nathelper.so"
loadmodule "permissions.so"
loadmodule "path.so"
loadmodule "dispatcher.so"
loadmodule "htable.so"
loadmodule "mqueue.so"
loadmodule "rtimer.so"
loadmodule "ratelimit.so"
loadmodule "regex.so"
loadmodule "sdpops.so"
loadmodule "exec.so"
loadmodule "xhttp.so"
loadmodule "xhttp_prom.so"
loadmodule "websocket.so"
loadmodule "stun.so"
loadmodule "tls.so"
loadmodule "uac.so"
#!ifdef SIPTRACE_CAPTURE_ID
loadmodule "siptrace.so"
#!endif

# ----------------- setting module-specific parameters ---------------

# ----- tm params -----
modparam("tm", "fr_timer", 2000)
modparam("tm", "fr_inv_timer", 70000)
modparam("tm", "wt_timer", 20000)

# ----- rr params -----
# add value to ;lr param to cope with most of the UAs
#modparam("rr", "enable_full_lr", 1)
# do not append from tag to the RR (no need for this script)
modparam("rr", "append_fromtag", 0)

# ----- outbound params -----
# modparam("outbound", "force_outbound_flag", 1)

# ----- dialog params -----
modparam("dialog", "db_mode", 0)

# ----- registrar params -----
modparam("registrar", "method_filtering", 1)
modparam("registrar", "max_contacts", 10)
modparam("registrar", "max_expires", 3600)
modparam("registrar", "use_path", 1)
modparam("registrar", "gruu_enabled", 1)
modparam("registrar", "outbound_mode", 0)
modparam("registrar", "path_mode", 1)
modparam("registrar", "expires_range", 30)
modparam("registrar", "retry_after", 30)
modparam("registrar", "regid_mode", 1)
modparam("registrar", "xavp_cfg", "regcfg")
modparam("registrar", "received_avp", "$avp(s:rcv)")

# ----- usrloc params -----
modparam("usrloc", "db_mode", 0)
modparam("usrloc", "use_domain", 1)
modparam("usrloc", "timer_procs", 4)
modparam("usrloc", "hash_size", 14)

# ----- nathelper params -----
modparam("nathelper", "received_avp", "$avp(s:rcv)")

# ----- permissions params -----
modparam("permissions", "db_url", DBURL)
modparam("permissions", "db_mode", 1)

# ----- dispatcher params -----
modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
modparam("dispatcher", "flags", 2)
modparam("dispatcher", "hash_pvar", "$avp(hash)")
modparam("dispatcher", "ds_hash_size", 8)
modparam("dispatcher", "ds_ping_interval", 20)
modparam("dispatcher", "ds_ping_from", "DS_PING_FROM")
modparam("dispatcher", "ds_probing_mode", 1)
modparam("dispatcher", "ds_ping_reply_codes", "class=2;code=480;code=404")

# ----- htable params -----
modparam("htable", "db_expires", 1)
modparam("htable", "timer_interval", 10)
modparam("htable", "timer_procs", 2)
modparam("htable", "htable", "auth_cache=>size=16;autoexpire=0;dmqreplicate=0;")
modparam("htable", "htable", "auth_failure_cache=>size=16;autoexpire=300;initval=0;dmqreplicate=0;")
modparam("htable", "htable", "number_cache=>size=16;autoexpire=0;dmqreplicate=0;")
modparam("htable", "htable", "domain_cache=>size=16;autoexpire=60;initval=0;dmqreplicate=0;")
modparam("htable", "htable", "dispatch_cache=>size=16;autoexpire=0;initval=0;dmqreplicate=0;")
modparam("htable", "htable", "dispatcher_sipcore_sets=>size=8;initval=DEFAULT_SIPCORE_SETID;")

# ----- mqueue params -----
modparam("mqueue", "mqueue", "name=UNREGISTER_EVENT_QUEUE_NAME;size=100000")

# ----- rtimer params -----
modparam("rtimer", "timer", "name=unregister_events;interval=1;mode=1;")
modparam("rtimer", "exec", "timer=unregister_events;route=UNREGISTER_EVENTS_QUEUE")

# ----- ratelimit params -----
modparam("ratelimit", "timer_interval", 5)
modparam("ratelimit", "queue", "0:SUBSCRIBE")
modparam("ratelimit", "queue", "1:REGISTER")
modparam("ratelimit", "queue", "2:INVITE")
modparam("ratelimit", "queue", "3:*")
modparam("ratelimit", "pipe", "0:RED:RATELIMIT_SUBSCRIBE")
modparam("ratelimit", "pipe", "1:RED:RATELIMIT_REGISTER")
modparam("ratelimit", "pipe", "2:RED:RATELIMIT_INVITE")
modparam("ratelimit", "pipe", "3:RED:RATELIMIT_DEFAULT")

# ----- cfgutils params -----
modparam("cfgutils", "initial_probability", 50)

# ----- sanity params -----
modparam("sanity", "default_checks", 487) # defaults without proxy-require

# ----- regex params -----
modparam("regex", "file", "/etc/kamailio/regex_groups")

# ----- xhttp_prom params -----
modparam("xhttp_prom", "xhttp_prom_stats", "all")

# ----- websocket params -----
modparam("websocket", "keepalive_timeout", 30)

# ----- uac params -----
modparam("uac", "restore_mode", "none")

# ----- tls params -----
modparam("tls", "config", "/etc/kamailio/main.tls.cfg")

#!ifdef SIPTRACE_CAPTURE_ID
# ----- siptrace params -----
modparam("siptrace", "duplicate_uri", "SIPTRACE_URI")
modparam("siptrace", "hep_mode_on", 1)
modparam("siptrace", "hep_version", 3)
modparam("siptrace", "hep_capture_id", SIPTRACE_CAPTURE_ID)
modparam("siptrace", "trace_to_database", 0)
modparam("siptrace", "trace_on", 1)
modparam("siptrace", "trace_init_mode", 2)
modparam("siptrace", "trace_mode", 1)
#!endif
